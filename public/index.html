<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nordisk kritisk infrastruktur</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b2430;--mut:#667;--bd:#dde1e6;--ok:#1a7f4b;--er:#c0392b;--wa:#b7791f}
@media(prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b222b;--tx:#e6e9ee;--mut:#9aa4b2;--bd:#2c3642;--ok:#4cc38a;--er:#f08070;--wa:#e0b050}}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,sans-serif;padding:16px}
h1{font-size:18px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px}
.card h2{font-size:14px;margin:0 0 6px;display:flex;justify-content:space-between;gap:8px}
.tag{font-size:11px;color:var(--mut);border:1px solid var(--bd);border-radius:10px;padding:0 6px;white-space:nowrap}
.row{display:flex;justify-content:space-between;gap:8px;padding:2px 0}.mut{color:var(--mut);font-size:12px}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}td,th{text-align:left;padding:3px 6px;border-bottom:1px solid var(--bd)}
.ok{color:var(--ok)}.error{color:var(--er)}.no_key,.stale{color:var(--wa)}
</style></head><body>
<h1>Nordisk kritisk infrastruktur <span class="mut" id="gen"></span></h1>
<div class="grid" id="grid"></div>
<div class="card" style="margin-top:12px"><h2>Källhälsa</h2><table id="health"></table></div>
<script>
// mode: live = A-källor i skelettet, stat = statistik/struktur, none = ingen API-källa bekräftad
const AREAS=[["Elförsörjning och energisystem","live"],["Elektronisk kommunikation och digital infrastruktur","stat"],["Transport och logistik","live"],["Vatten och avloppshantering","none"],["Cybersäkerhet och digitala hot","live"],["Hälso- och sjukvård","none"],["Industri, tillverkning och försörjningskedjor","stat"],["Livsmedel och jordbruk","none"],["Finans och betalningssystem","none"],["Rymd, navigation och positionering","none"],["Miljö, naturhändelser och klimatpåverkan","live"],["Offentlig förvaltning och samhällsberedskap","none"]];
const LBL={live:"Live",stat:"Statistik",none:"Ej API"};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function load(){
  const s=await (await fetch("/api/state")).json();
  document.getElementById("gen").textContent="· uppdaterad "+new Date(s.generatedAt).toLocaleTimeString("sv-SE");
  const hs=Object.fromEntries(s.health.map(h=>[h.id,h]));
  document.getElementById("grid").innerHTML=AREAS.map(([n,m],i)=>{
    const items=s.items.filter(x=>x.area===i+1);
    const body=items.length?items.map(x=>`<div class="row"><span>${esc(x.country)} · ${esc(x.indicator)}</span><b>${esc(x.value)} ${esc(x.unit)}</b></div>`).join("")
      :`<div class="mut">${m==="none"?"Ingen bekräftad API-källa – se Excel (klass B/C).":"Väntar på data eller nyckel saknas."}</div>`;
    return `<div class="card"><h2><span>${i+1}. ${n}</span><span class="tag">${LBL[m]}</span></h2>${body}</div>`}).join("");
  document.getElementById("health").innerHTML="<tr><th>Källa</th><th>Område</th><th>Status</th><th>Senast OK</th><th>Fel</th></tr>"+
    s.health.map(h=>{const age=h.lastOk?(Date.now()-new Date(h.lastOk))/1000:null;const st=h.status==="ok"&&age>h.every*3?"stale":h.status;
      return `<tr><td>${esc(h.id)}</td><td>${h.area}</td><td class="${st}">${st}</td><td>${h.lastOk?new Date(h.lastOk).toLocaleTimeString("sv-SE"):"–"}</td><td>${esc(h.error)}</td></tr>`}).join("");
}
load();setInterval(load,30000);
</script></body></html>
